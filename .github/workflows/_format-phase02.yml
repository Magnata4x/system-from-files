name: phase-02-format-once

on:
  push:
    branches: [fase02-fix/ci-tests]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/dashboard-store.ts src/lib/market-symbols.ts src/routes/_authenticated/dashboard.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dashboard-store.ts src/lib/market-symbols.ts src/routes/_authenticated/dashboard.tsx
          git commit -m "chore: format dashboard files"
          git push
