name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized npm lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git stash push -- package-lock.json
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          git stash pop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(ci): synchronize package-lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: >-
          npx eslint --rule "prettier/prettier: off"
          src/lib/dashboard-store.ts
          src/routes/_authenticated/dashboard.tsx
          src/lib/market-data-store.tsx
          src/lib/market-data-store.test.ts
          src/lib/market.functions.ts
          src/lib/market-data.ts
          src/lib/market-symbols.ts
          src/lib/data-status.ts
          src/components/dashboard/data-status.tsx
          src/hooks/useLivePrices.ts
          src/lib/bot4x-store.ts
          src/lib/bot4x-breaker.test.ts
          src/lib/dashboard-store.test.ts
          src/lib/tour-content.test.ts
          src/components/dashboard/metric-cards.tsx
          src/components/dashboard/integration-widgets.tsx
          src/components/dashboard/top-bar.tsx src/components/dashboard/asset-heatmap.tsx src/components/dashboard/alerts-feed.tsx src/components/dashboard/signals-table.tsx src/components/dashboard/announcement-banner.tsx src/components/dashboard/command-palette.tsx src/components/dashboard/signal-drawer.tsx src/components/dashboard/dna-panel.tsx src/hooks/useDnaProfile.ts src/components/dashboard/dna-panel.test.tsx
      - run: npx vitest run src/lib/market-data-store.test.ts
      - run: npm run test
