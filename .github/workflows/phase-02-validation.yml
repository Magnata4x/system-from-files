name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: 'npx eslint --rule "prettier/prettier: off" src/lib/market-data-store.tsx src/lib/market.functions.ts src/lib/market-data-store.test.ts src/routes/__root.tsx src/routes/_authenticated.tsx src/components/dashboard/btc-dominance.tsx src/components/dashboard/fear-greed-gauge.tsx src/components/dashboard/asset-heatmap.tsx src/components/dashboard/metric-cards.tsx src/components/dashboard/top-bar.tsx'
      - run: npx vitest run src/lib/market-data-store.test.ts
      - name: Diagnose auth-flow test
        continue-on-error: true
        run: npx vitest run src/lib/__tests__/auth-flow.test.tsx
      - name: Diagnose bot4x-mode test
        continue-on-error: true
        run: npx vitest run src/lib/__tests__/bot4x-mode.test.ts
      - name: Diagnose tab-historico virtualization test
        continue-on-error: true
        run: npx vitest run src/components/bot4x/__tests__/tab-historico.virtualization.test.tsx
      - name: Diagnose email queue process test
        continue-on-error: true
        run: npx vitest run src/routes/lovable/email/queue/__tests__/process.test.ts
      - name: Full Vitest suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=.vitest-results.json
          status=$?
          if [ "$status" -ne 0 ]; then
            node - <<'NODE'
            const fs = require('node:fs')
            const report = JSON.parse(fs.readFileSync('.vitest-results.json', 'utf8'))
            const failures = []
            for (const file of report.testResults ?? []) {
              for (const test of file.assertionResults ?? []) {
                if (test.status === 'failed') {
                  failures.push({ file: file.name, test: test.fullName, message: test.failureMessages?.join('\n').slice(0, 4000) ?? 'failure' })
                }
              }
            }
            const suites = (report.testResults ?? []).filter((file) => file.status === 'failed').map((file) => file.name)
            const body = ['### Vitest failure diagnostics', '', `Failed suites: ${suites.length}`, suites.map((s) => `- ${s}`).join('\n'), '', ...failures.map((f) => `#### ${f.test}\n\`${f.file}\`\n\n\`\`\`\n${f.message}\n\`\`\``)].join('\n')
            fs.writeFileSync('.vitest-failure-comment.md', body)
            NODE
            gh pr comment "${{ github.event.pull_request.number }}" --body-file .vitest-failure-comment.md
          fi
          exit "$status"
