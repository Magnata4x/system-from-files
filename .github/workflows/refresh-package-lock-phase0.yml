name: refresh-package-lock-phase0

on:
  push:
    branches: [phase-0-dashboard-real-data]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh npm lockfile security fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0-dashboard-real-data
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock with npm audit fix
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile security fixes"
          git push origin HEAD:phase-0-dashboard-real-data
