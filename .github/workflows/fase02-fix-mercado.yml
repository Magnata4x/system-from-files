name: Fase 02 fix — mercado validation

on:
  push:
    branches:
      - fase02-fix/mercado
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint src/lib/market-data-store.tsx src/lib/market.functions.ts src/lib/market-data-store.test.ts src/routes/__root.tsx src/routes/_authenticated.tsx src/components/dashboard/btc-dominance.tsx src/components/dashboard/fear-greed-gauge.tsx src/components/dashboard/asset-heatmap.tsx src/components/dashboard/metric-cards.tsx src/components/dashboard/top-bar.tsx
      - run: npx vitest run src/lib/market-data-store.test.ts
      - name: Full test suite (baseline)
        run: npm run test
        continue-on-error: true
