name: security-lock-refresh

on:
  push:
    branches:
      - chore/security-audit-2026-10-06

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/security-audit-2026-10-06
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable transitive dependencies
        run: |
          npm pkg set overrides.seroval=1.6.4
          npm pkg set overrides.source-map-js=1.2.2
          npm pkg set overrides.sharp=0.35.5
          npm install --package-lock-only
          npm audit --audit-level=moderate
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh vulnerable transitive dependencies"
          git push
